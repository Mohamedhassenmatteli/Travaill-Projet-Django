<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>expedition list</h1>
    <ul>
        {% for expedition in list %}
            <li>
                    <a href="{% url 'Expidation:detail' expedition.reference %}">{{ expedition.reference }}</a>
                - {{ expedition.entreprise }}
                <a href="{% url 'Expidation:delete' expedition.reference %}">Supprimer</a>
            </li>
            {% empty %}
                No expeditions available
        {% endfor %}
    </ul>
</body>
</html>
